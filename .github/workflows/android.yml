name: Compilar APK del administrador

# Compila la app Android (android/) en los servidores de GitHub y deja el APK
# firmado para descargar en la pestaña Actions. Se ejecuta a mano (Actions → Run workflow).
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Preparar la clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/firma.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/firma.keystore" >> "$GITHUB_ENV"

      - name: Compilar APK firmado
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: gradle -p android :app:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: C-Y-Recepcion-APK
          path: android/app/build/outputs/apk/release/app-release.apk
